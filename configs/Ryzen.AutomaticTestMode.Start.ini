# This config uses the Automatic Test Mode to automatically adjust the Curve Optimizer values
# on Ryzen processors after an error has occurred
# It sets the Curve Optimizer values to the minimum value and will make it less aggressive
# step by step when an error or a crash occurs
#
# The test now runs until every core has found a good value (or until the maxValue has been reached
# for a core), so expect this to take many hours
# The found values are permanently stored in the "*_automode-results.txt" file in the logs directory
#
# Author: sp00n


[General]
stressTestProgram = YCRUNCHER
runtimePerCore = auto
coreTestOrder = Default
numberOfThreads = 1

# Note: maxIterations is not used in the Automatic Test Mode


[yCruncher]
mode = auto                 # This chooses the binary automatically, e.g. "19-ZN2 ~ Kagari" for Ryzen 5000 or "24-ZN5 ~ Komari" for Ryzen 9000
tests = SFTv4, FFTv4, N63   # Limit the tests to stressful ones
#tests = BKT, BBP, SFTv4, SNT, SVT, FFTv4, N63, VT3   # These would be all of the available tests

# 20 seconds per test
testDuration = 20


[AutomaticTestMode]
enableAutomaticAdjustment = 1
startValues = -35,-40,-40,-40,-40,-40,-40,-40,-40,-40,-40,-40,-40,-40,-40,-40     		# Start from a reasonable value
maxValue = 5                # Do not go above Curve Optimizer value of 5
incrementBy = 1             # Adjust the Curve Optimizer value by 1 after an error


# A core needs to complete this many test runs in a row without an error before its Curve Optimizer
# value is considered good and the core is not tested anymore
# Higher values give you more confidence, but the test will take proportionally longer
passesToConfirmCoreValue = 5


# Stay on a core until it has a final value, so that one core is finished after the other
# Set this to 0 to test each core once per iteration and cycle through the whole test order repeatedly instead
repeatCoreUntilConfirmed = 1


# If you already know the good value for some of the cores, you can enter them here
# These cores will then not be tested at all
# You can find a ready to use line at the end of the "*_automode-results.txt" file of a previous run
#knownGoodValues = 3:-25, 7:-18


# Set the Curve Optimizer value only for the currently tested core
# All other cores will be set to 0, to avoid any possible interference
setVoltageOnlyForTestedCore = 1


# Apply the Curve Optimizer values before every test run
# Which values are written follows "setVoltageOnlyForTestedCore" above, so this never changes which core runs at
# which value: the tested core keeps its target value and all the other cores stay at 0
#
# Note: With "setVoltageOnlyForTestedCore" enabled the values are already applied per core, so this setting changes
#       nothing here. It matters when "setVoltageOnlyForTestedCore" is disabled, where the values would otherwise
#       only be applied at the start of the run and after an increase
applyValuesBeforeEachTest = 1


# Set the PBO max boost frequency to an absolute value in MHz ("Max CPU Boost Clock Override" in the BIOS)
# Note: Only supported on Zen 4 and upwards, and it is lost on a reboot, just like the Curve Optimizer values
# Note: The firmware clamps the value to roughly +200 MHz above the fused default, so a higher value may be
#       adjusted downwards by the firmware. The applied value is read back and reported
pboMaxFrequency = 5000


# Apply an offset to the PBO max boost frequency ("Max CPU Boost Clock Override" in the BIOS)
# The value is an offset in MHz from the currently active value, so 50 means "+50 MHz"
# Note: Is ignored as long as "pboMaxFrequency" above is set
#pboMaxFrequencyOffset = 50


# Print the currently applied PBO settings at the start of the run
# This shows the Curve Optimizer value of every core, the PBO limits (PPT / TDC / EDC), the PBO scalar and the
# max boost frequency, so that it is clear which settings the test is based on
showCurrentPboSettings = 1


# Setting to try to automatically resume after a crash / hard reboot
# For this to work properly, Auto Logon should be activated
# Otherwise the computer will just idle at the logon screen after a crash
# See https://learn.microsoft.com/en-us/sysinternals/downloads/autologon
# and https://learn.microsoft.com/en-us/troubleshoot/windows-server/user-profiles-and-logon/turn-on-automatic-logon
enableResumeAfterUnexpectedExit = 1


# We want to create a System Restore Point before starting the whole process
# Crashes can cause a corrupted Windows installation, and a Restore Point can help fix that
createSystemRestorePoint = 1


# Create the System Restore Point without asking
# It will only do so at the beginning, not during the process, and only once within 24 hours
#
# Note: This is set to 0 so that an unattended run cannot block on the confirmation prompt.
#       The Restore Point is still created, it is just not asked for
askForSystemRestorePointCreation = 0

# Resume faster after recovering from reboot
# waitBeforeAutomaticResume = 20